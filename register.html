
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - ExpiryGuard</title>

    <link rel="stylesheet" href="login.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="auth-container">

        <div class="auth-header">
            <h2>
                <i class="fa-solid fa-boxes-stacked"></i>
                ExpiryGuard
            </h2>
            <p>Product Expiry Alert Management System</p>
        </div>

        <form id="registerForm">

            <div class="input-group">
                <label for="name">Full Name</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your full name"
                    required>
            </div>

            <div class="input-group">
                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Choose a username"
                    required>
            </div>

            <div class="input-group">
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email address"
                    required>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Minimum 8 characters"
                    minlength="8"
                    required>
            </div>

            <div class="input-group">
                <label for="confirm_password">Confirm Password</label>
                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    placeholder="Confirm your password"
                    required>

                <small id="errorMessage" class="error-text" style="display: none;"></small>
            </div>

            <p id="message" class="error-text"></p>

            <button type="submit" class="btn-submit" id="registerButton">
                Register Account
            </button>

        </form>

        <div class="auth-footer">
            <p>
                Already have an account?
                <a href="index.html">Login here</a>
            </p>
        </div>

    </div>

    <script src="register.js"></script>

</body>
</html>
